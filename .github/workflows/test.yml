name: Unit Test

on:
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  build:
    strategy:
      matrix:
        os: [ macOS-latest, ubuntu-latest, windows-latest ]
        include:
          - os: macOS-latest
            job: allTests
          - os: ubuntu-latest
            job: allTests -x :integrations:launch-darkly:allTests
          - os: windows-latest
            job: allTests -x :integrations:launch-darkly:allTests


    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4.5.0
        with:
          distribution: 'zulu'
          java-version: 17

      - run: ./gradlew ${{matrix.job}}

